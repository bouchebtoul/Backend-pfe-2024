<div class="modules-section">
    <div class="section-header">
        <h2>Modules Management</h2>
        <button id="addModuleBtn" class="add-button">
            <i class="fas fa-plus"></i> Add Module
        </button>
    </div>
    
    <table class="modules-table">
        <thead>
            <tr class="header-row">
                <th>Code</th>
                <th>Name</th>
                <th>Level</th>
                <th>Semester</th>
                <th>Credits</th>
                <th>Coefficient</th>
                <th>Teaching Unit</th>
                <th>Hours (L/T/W)</th>
                <th>Actions</th>
            </tr>
            <tr class="filter-row">
                <th><input type="text" class="filter-input" data-column="code" placeholder="Filter code..."></th>
                <th><input type="text" class="filter-input" data-column="name" placeholder="Filter name..."></th>
                <th><input type="text" class="filter-input" data-column="level" placeholder="Filter level..."></th>
                <th><input type="number" class="filter-input" data-column="semester" placeholder="Filter semester..."></th>
                <th><input type="number" class="filter-input" data-column="credits" placeholder="Filter credits..."></th>
                <th><input type="number" class="filter-input" data-column="coefficient" placeholder="Filter coefficient..."></th>
                <th><input type="text" class="filter-input" data-column="teachingUnit" placeholder="Filter unit..."></th>
                <th><input type="text" class="filter-input" data-column="hours" placeholder="Filter hours..."></th>
                <th></th>
            </tr>
        </thead>
        <tbody id="modulesTableBody">
            <!-- Modules will be loaded here -->
        </tbody>
    </table>
</div>

<!-- Module Modal -->
<div id="moduleModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 id="moduleModalTitle" class="modal-title">Add New Module</h2>
        
        <form id="moduleForm">
            <div class="form-group">
                <label for="code">Code</label>
                <input type="text" id="code" name="code" required 
                       placeholder="Enter module code">
            </div>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required 
                       placeholder="Enter module name">
            </div>

            <div class="form-row selection-row">
                <div class="form-group">
                    <label for="departmentId">Department</label>
                    <select id="departmentId" name="departmentId" required>
                        <option value="">Select a department</option>
                        <!-- Departments will be loaded here -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="specialityId">Speciality</label>
                    <select id="specialityId" name="specialityId" required disabled>
                        <option value="">Select a speciality</option>
                        <!-- Specialities will be loaded here -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="levelId">Level</label>
                    <select id="levelId" name="levelId" required disabled>
                        <option value="">Select a level</option>
                        <!-- Levels will be loaded here -->
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="semester">Semester</label>
                <input type="number" id="semester" name="semester" required 
                       placeholder="Enter semester number" min="1" max="2">
            </div>

            <div class="form-group">
                <label for="credits">Credits</label>
                <input type="number" id="credits" name="credits" required 
                       placeholder="Enter credits" min="1">
            </div>

            <div class="form-group">
                <label for="coefficient">Coefficient</label>
                <input type="number" id="coefficient" name="coefficient" required 
                       placeholder="Enter coefficient" min="1" step="0.1">
            </div>

            <div class="form-group">
                <label for="teachingUnitCode">Teaching Unit Code</label>
                <input type="text" id="teachingUnitCode" name="teachingUnitCode" required 
                       placeholder="Enter teaching unit code">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="lects">Lectures Hours</label>
                    <input type="number" id="lects" name="lects" required 
                           placeholder="Lectures" min="0">
                </div>

                <div class="form-group">
                    <label for="tuts">Tutorials Hours</label>
                    <input type="number" id="tuts" name="tuts" required 
                           placeholder="Tutorials" min="0">
                </div>

                <div class="form-group">
                    <label for="wkshs">Workshops Hours</label>
                    <input type="number" id="wkshs" name="wkshs" required 
                           placeholder="Workshops" min="0">
                </div>
            </div>
            
            <button type="submit" class="submit-button">Save Module</button>
        </form>
    </div>
</div>
