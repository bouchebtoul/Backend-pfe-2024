<div class="modules-section">
    <div class="section-header">
        <h2>Modules Management</h2>
        <button id="addModuleBtn" class="add-button">
            <i class="fas fa-plus"></i> Add Module
        </button>
    </div>
    
    <table class="academic-table">
        <thead>
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Level</th>
                <th>Semester</th>
                <th>Credits</th>
                <th>Coefficient</th>
                <th>Teaching Unit</th>
                <th>Hours (L/T/W)</th>
                <th>Actions</th>
            </tr>
            <tr class="filter-row">
                <th><input type="text" class="filter-input" data-column="code" placeholder="Filter code..."></th>
                <th><input type="text" class="filter-input" data-column="name" placeholder="Filter name..."></th>
                <th>
                    <select class="filter-input" data-column="level">
                        <option value="">All Levels</option>
                        <!-- Levels will be loaded here -->
                    </select>
                </th>
                <th>
                    <select class="filter-input" data-column="semester">
                        <option value="">All Semesters</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                    </select>
                </th>
                <th>
                    <select class="filter-input" data-column="credits">
                        <option value="">All Credits</option>
                        <!-- Credits options will be loaded dynamically -->
                    </select>
                </th>
                <th>
                    <select class="filter-input" data-column="coefficient">
                        <option value="">All Coefficients</option>
                        <!-- Coefficient options will be loaded dynamically -->
                    </select>
                </th>
                <th>
                    <select class="filter-input" data-column="teachingUnit">
                        <option value="">All Units</option>
                        <!-- Teaching units will be loaded dynamically -->
                    </select>
                </th>
                <th><input type="text" class="filter-input" data-column="hours" placeholder="Filter hours..."></th>
                <th></th>
            </tr>
        </thead>
        <tbody id="modulesTableBody">
            <!-- Template for module row -->
            <template id="moduleRowTemplate">
                <tr>
                    <td data-field="code"></td>
                    <td data-field="name"></td>
                    <td data-field="level"></td>
                    <td data-field="semester"></td>
                    <td data-field="credits"></td>
                    <td data-field="coefficient"></td>
                    <td data-field="teachingUnit"></td>
                    <td data-field="hours"></td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-edit" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-delete" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </template>
        </tbody>
    </table>
</div>

<!-- Module Modal -->
<div id="moduleModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 id="moduleModalTitle" class="modal-title">Add New Module</h2>
        
        <form id="moduleForm">
            <div class="form-group">
                <label for="code">Code</label>
                <input type="text" id="code" name="code" required 
                       placeholder="Enter module code">
            </div>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required 
                       placeholder="Enter module name">
            </div>

            <div class="selection-row">
                <div class="form-group">
                    <label for="departmentId">Department</label>
                    <select id="departmentId" name="departmentId" required>
                        <option value="">Select a department</option>
                        <!-- Departments will be loaded here -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="specialityId">Speciality</label>
                    <select id="specialityId" name="specialityId" required disabled>
                        <option value="">Select a speciality</option>
                        <!-- Specialities will be loaded here -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="levelId">Level</label>
                    <select id="levelId" name="levelId" required disabled>
                        <option value="">Select a level</option>
                        <!-- Levels will be loaded here -->
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="semester">Semester</label>
                <select id="semester" name="semester" required>
                    <option value="">Select semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="credits">Credits</label>
                    <input type="number" id="credits" name="credits" required 
                           min="1" max="30" placeholder="Credits">
                </div>

                <div class="form-group">
                    <label for="coefficient">Coefficient</label>
                    <input type="number" id="coefficient" name="coefficient" required 
                           min="1" max="5" placeholder="Coefficient">
                </div>

                <div class="form-group">
                    <label for="teachingUnitCode">Teaching Unit Code</label>
                    <input type="text" id="teachingUnitCode" name="teachingUnitCode" required 
                           placeholder="e.g., UE1, UE2">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="lects">Lecture Hours</label>
                    <input type="number" id="lects" name="lects" required 
                           min="0" placeholder="Lecture hours">
                </div>

                <div class="form-group">
                    <label for="tuts">Tutorial Hours</label>
                    <input type="number" id="tuts" name="tuts" required 
                           min="0" placeholder="Tutorial hours">
                </div>

                <div class="form-group">
                    <label for="wkshs">Workshop Hours</label>
                    <input type="number" id="wkshs" name="wkshs" required 
                           min="0" placeholder="Workshop hours">
                </div>
            </div>
            
            <button type="submit" class="submit-button">Save Module</button>
        </form>
    </div>
</div>
