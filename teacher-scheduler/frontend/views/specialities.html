<div class="specialities-section">
    <div class="section-header">
        <h2>Specialities Management</h2>
        <button id="addSpecialityBtn" class="add-button">
            <i class="fas fa-plus"></i> Add Speciality
        </button>
    </div>
    
    <table class="academic-table">
        <thead>
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Description</th>
                <th>Department</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="specialitiesTableBody">
            <!-- Template for speciality row -->
            <template id="specialityRowTemplate">
                <tr>
                    <td data-field="code"></td>
                    <td data-field="name"></td>
                    <td data-field="description"></td>
                    <td data-field="department"></td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-edit" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-delete" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </template>
        </tbody>
    </table>
</div>

<!-- Speciality Modal -->
<div id="specialityModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 id="specialityModalTitle" class="modal-title">Add New Speciality</h2>
        
        <form id="specialityForm">
            <div class="form-group">
                <label for="code">Code</label>
                <input type="text" id="code" name="code" required 
                       placeholder="Enter speciality code">
            </div>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required 
                       placeholder="Enter speciality name">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3"
                          placeholder="Enter speciality description"></textarea>
            </div>
            
            <div class="form-group">
                <label for="departmentid">Department</label>
                <select id="departmentid" name="departmentid" required>
                    <option value="">Select Department</option>
                </select>
            </div>
            
            <button type="submit" class="submit-button">Save Speciality</button>
        </form>
    </div>
</div>
